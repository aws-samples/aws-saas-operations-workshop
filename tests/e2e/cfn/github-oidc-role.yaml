AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GitHub OIDC provider and the role the e2e deployment test assumes (tests/e2e). Deploy once,
  by hand, into the dedicated test account. The role is admin because the workshop deployment
  creates IAM roles, CloudFront distributions, Cognito pools and CloudTrail trails; keep the
  account free of anything else.

Parameters:
  GitHubRepository:
    Type: String
    Default: aws-samples/aws-saas-operations-workshop
    Description: owner/name of the repository allowed to assume the role
  EnvironmentName:
    Type: String
    Default: e2e
    Description: >
      GitHub environment the workflow job runs in. The trust policy only admits tokens issued
      for this environment, so the environment's deployment branch policy ("Selected branches:
      main") is what restricts which branches may assume the role. An environment without that
      policy admits any branch with write access to the repository.
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to false if the account already has the token.actions.githubusercontent.com provider

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        # Not used for validation since 2023 (AWS trusts GitHub's root CA), but the property is required.
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  E2ERole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W43
            reason: The e2e test deploys the whole workshop, which creates IAM roles and many service resources, in a dedicated sandbox account
    Properties:
      RoleName: saasops-workshop-e2e
      Description: Assumed by the GitHub Actions e2e workflow of aws-saas-operations-workshop
      MaxSessionDuration: 10800
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # A job with `environment: e2e` always presents this subject, whatever branch it
                # runs from (a `ref:` subject is never issued for such a job). Branch control
                # therefore lives in the environment's deployment branch policy on GitHub.
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:${EnvironmentName}
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess

Outputs:
  RoleArn:
    Description: Set this as the repository variable E2E_ROLE_ARN
    Value: !GetAtt E2ERole.Arn
